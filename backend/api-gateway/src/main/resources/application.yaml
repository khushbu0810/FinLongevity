spring:
  application:
    name: api-gateway

server:
  port: 8012

#Registering api gateway on eureka client discovery server -----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted