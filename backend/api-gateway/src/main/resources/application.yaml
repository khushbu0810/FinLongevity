spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**


server:
  port: 8082

#Registering api gateway on eureka client discovery server -----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yRmluTG9uZ2V2aXR5RGV2T25seTEyMzQ1Njc4OTA=}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted