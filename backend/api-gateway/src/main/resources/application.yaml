spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: investment-service
              uri: lb://investment-service
              predicates:
                - Path=/api/investments/**
            - id: provider-service
              uri: lb://product-provider-service
              predicates:
                - Path=/api/providers/**
            - id: product-service
              uri: lb://product-provider-service
              predicates:
                - Path=/api/products/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**

            #SWAGGER DOCUMENTATION ROUTES
            - id: identity-swagger
              uri: lb://identity-service
              predicates:
                - Path=/identity/v3/api-docs
              filters:
                - StripPrefix=1
            - id: customer-swagger
              uri: lb://customer-service
              predicates:
                - Path=/customer/v3/api-docs
              filters:
                - StripPrefix=1
            - id: investment-swagger
              uri: lb://investment-service
              predicates:
                - Path=/investment/v3/api-docs
              filters:
                - StripPrefix=1
            - id: product-provider-swagger
              uri: lb://product-provider-service
              predicates:
                - Path=/product-provider/v3/api-docs
              filters:
                - StripPrefix=1
            - id: payment-swagger
              uri: lb://payment-service
              predicates:
                - Path=/payment/v3/api-docs
              filters:
                - StripPrefix=1
#    CORS -------------
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

#SWAGGER UI CONFIGURATION
springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

    urls:
      - name: Identity Service
        url: /identity/v3/api-docs

      - name: Customer Service
        url: /customer/v3/api-docs

      - name: Investment Service
        url: /investment/v3/api-docs

      - name: Product Provider Service
        url: /product-provider/v3/api-docs

      - name: Payment Service
        url: /payment/v3/api-docs

    urls-primary-name: Identity Service
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha


server:
  port: 8082

#Registering api gateway on eureka client discovery server -----
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yRmluTG9uZ2V2aXR5RGV2T25seTEyMzQ1Njc4OTA=}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted