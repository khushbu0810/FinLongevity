spring:
  application:
    name: identity-service
  config:
    import: optional:configserver:http://localhost:8012
#    this import will load DB credentials from configServer yaml

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  instance:
    prefer-ip-address: true