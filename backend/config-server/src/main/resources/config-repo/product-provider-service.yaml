server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/financial_provider_db
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8010/eureka

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9yRmluTG9uZ2V2aXR5RGV2T25seTEyMzQ1Njc4OTA=}
    expiration-ms: 900000

management:
  endpoints:
    web:
      exposure:
        include: "*"