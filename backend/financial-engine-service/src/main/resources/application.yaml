spring:
  application:
    name: financial-engine-service
  config:
    import: configserver:http://localhost:8012

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

eureka:
  instance:
    prefer-ip-address: true

services:
  customer:
    base-url: http://localhost:8081